[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "namethellm"
version = "0.1.0"
description = "Authorship attribution pipeline across 18 frontier LLMs"
authors = [{ name = "Ganesh Beldar" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
    "lightgbm>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
